<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Trzęsienia ziemi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { height: 100vh; width: 100%; }
    .info {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      background: white; padding: 10px 14px; border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.3); font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info" id="info">Ładowanie…</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    function color(mag) {
      if (mag >= 6) return '#d73027';
      if (mag >= 5) return '#fc8d59';
      if (mag >= 4) return '#fee08b';
      return '#91cf60';
    }

    fetch('/api/earthquakes')
      .then(r => r.json())
      .then(data => {
        document.getElementById('info').textContent =
          `${data.length} trzęsień ziemi`;
        data.forEach(eq => {
          L.circleMarker([eq.latitude, eq.longitude], {
            radius: Math.max(4, eq.magnitude * 3),
            fillColor: color(eq.magnitude),
            color: '#333', weight: 1, fillOpacity: 0.7
          })
          .bindPopup(
            `<b>${eq.place ?? 'Nieznane miejsce'}</b><br>` +
            `Magnituda: ${eq.magnitude}<br>` +
            `Głębokość: ${eq.depth} km<br>` +
            `Czas: ${new Date(eq.time).toLocaleString('pl-PL')}`
          )
          .addTo(map);
        });
      })
      .catch(err => {
        document.getElementById('info').textContent = 'Błąd ładowania danych';
        console.error(err);
      });
  </script>
</body>
</html>
